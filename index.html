<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Propina</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #1a1a2e;
            color: #eee;
            text-align: center;
            padding: 100px;
        }
        button {
            padding: 15px 30px;
            font-size: 20px;
            background: #e94560;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(233, 69, 96, 0.4);

        button:hover { background: #ff5773; }
    </style>

<body>

    <h1>Calculadora de Propina</h1>
    <p>Haz clic en el botón para comenzar</p>
